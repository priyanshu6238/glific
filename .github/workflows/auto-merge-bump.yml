name: Auto-merge version bump

on:
  pull_request:
    types: [opened, labeled, synchronize]
    branches: [master]

concurrency:
  group: auto-merge-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'version-bump') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["priyanshu6238"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Ensure only the mix.exs version line changed
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[]' | jq -s '.')

          [ "$(jq 'length' <<<"$FILES")" = "1" ]                || fail "PR must change exactly one file"
          [ "$(jq -r '.[0].filename' <<<"$FILES")" = "mix.exs" ] || fail "Only mix.exs may be changed"
          [ "$(jq -r '.[0].status' <<<"$FILES")" = "modified" ]  || fail "mix.exs must be modified, not added/renamed/removed"
          [ "$(jq '.[0].additions' <<<"$FILES")" = "1" ]         || fail "Exactly one line must be added"
          [ "$(jq '.[0].deletions' <<<"$FILES")" = "1" ]         || fail "Exactly one line must be removed"

          PATCH=$(jq -r '.[0].patch' <<<"$FILES")
          OLD_LINE=$(grep -E '^-' <<<"$PATCH" || true)
          NEW_LINE=$(grep -E '^\+' <<<"$PATCH" || true)

          RE='^[-+][[:space:]]*version: "([0-9]+\.[0-9]+\.[0-9]+)",$'
          [[ $OLD_LINE =~ $RE ]] || fail "Removed line is not a version line: $OLD_LINE"
          OLD=${BASH_REMATCH[1]}
          [[ $NEW_LINE =~ $RE ]] || fail "Added line is not a version line: $NEW_LINE"
          NEW=${BASH_REMATCH[1]}

          [ "$OLD" != "$NEW" ] || fail "Version did not change"
          HIGHEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          [ "$HIGHEST" = "$NEW" ] || fail "New version $NEW is not higher than $OLD"

          echo "✅ Valid bump: $OLD -> $NEW"

      - name: Approve and merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "Auto-approved version bump"
          gh pr merge  "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
